services:
  archstudio:
    build: .
    ports:
      # One knob: set PORT in .env (or the shell) and both sides follow.
      - "${PORT:-3000}:${PORT:-3000}"
    # Nothing to set: the entrypoint runs the server as whoever owns ./data,
    # and claims the directory for uid 1000 when Docker has just created it as
    # root. That is what makes one compose file work on a Linux server, on a
    # PaaS that deploys as root, and on macOS, where the mount arrives owned by
    # you and not by the image's user.
    #
    # Uncomment to pin it instead — for rootless Docker or Podman, where the
    # container cannot start as root and so cannot adapt:
    #   user: "${DOCKER_UID:-1000}:${DOCKER_GID:-1000}"
    volumes:
      - ./data:/app/data
    environment:
      - DATABASE_PATH=/app/data/studio.db
      # next start reads PORT itself, so the container listens where you say.
      - PORT=${PORT:-3000}
      # Set both and this install comes up asking for them — no dialog, and no
      # window in which the first visitor claims the account. Leave them unset
      # and there is no login at all: put it behind a VPN.
      - AUTH_USERNAME=${AUTH_USERNAME:-}
      - AUTH_PASSWORD=${AUTH_PASSWORD:-}
      - AUTH_NAME=${AUTH_NAME:-}
      # Mark the session cookie `secure` once this is served over HTTPS. On
      # plain HTTP the browser drops it and signing in appears to do nothing.
      - SECURE_COOKIES=${SECURE_COOKIES:-}
      # Optional — copy .env.example to .env and fill in the ones you use.
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - NVIDIA_API_KEY=${NVIDIA_API_KEY:-}
      - POOLSIDE_API_KEY=${POOLSIDE_API_KEY:-}
      # The endpoint too, for the two providers whose endpoint is yours to pick —
      # an internal Poolside instance, or your own vLLM alongside this container.
      - POOLSIDE_BASE_URL=${POOLSIDE_BASE_URL:-}
      - OPENAI_COMPATIBLE_BASE_URL=${OPENAI_COMPATIBLE_BASE_URL:-}
    restart: unless-stopped
